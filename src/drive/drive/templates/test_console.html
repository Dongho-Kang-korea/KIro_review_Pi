/* --- 카메라: 화면 전체 --- */
/* 화면을 거의 다 채우되 가장자리를 조금 비운다 — 그 틈으로 위장 무늬가
   테두리처럼 보인다. 카메라가 창을 정확히 채우면 무늬가 아예 안 보인다. */
#cam{position:fixed;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);
     object-fit:contain;display:block;z-index:0;border-radius:14px;
     border:1px solid rgba(126,232,255,.22);
     box-shadow:0 0 0 3px rgba(0,0,0,.5), 0 0 34px rgba(0,0,0,.6)}

/* --- HUD 공통: 반투명 유리 --- */
.hud{position:fixed;z-index:2;background:var(--glass);
     border:1px solid var(--edge);border-radius:12px;
     backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
     box-shadow:0 0 22px rgba(0,0,0,.55), inset 0 0 24px rgba(126,232,255,.05)}
.k{font-size:10px;letter-spacing:.08em;color:#8fb6c8;text-transform:uppercase}
.v{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.ok{color:var(--good)}.bad{color:var(--bad)}

/* 좌상단 — 제목 */
#top{top:14px;left:14px;padding:9px 14px;display:flex;align-items:center;gap:12px}
#top h1{margin:0;font-size:15px;letter-spacing:.14em;color:var(--key)}
#clock{font-size:11px;color:#8fb6c8}

/* 우상단 — 연결 상태 칩 */
#chips{top:14px;right:14px;padding:10px 12px;display:grid;
       grid-template-columns:repeat(2,minmax(88px,auto));gap:8px 16px}
#chips div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#chips .v{font-size:13px}

/* 좌하단 — 주행 상태 */
#state{left:14px;bottom:14px;padding:11px 14px;display:grid;
       grid-template-columns:repeat(2,auto);gap:7px 22px}
#state .v{font-size:14px}

/* 중앙 상단 — 결합 상태 (가장 중요) */
#couple{top:14px;left:50%;transform:translateX(-50%);padding:9px 18px;
        text-align:center;max-width:44vw}
#couple .v{font-size:14px;color:var(--warn)}

/* 우하단 — 버튼 4개 */
#acts{right:14px;bottom:14px;padding:10px;display:grid;gap:8px;width:236px}
button{padding:12px;border:1px solid var(--edge);border-radius:9px;
  font:inherit;font-weight:800;cursor:pointer;color:#eaf6ff;
  background:rgba(20,32,40,.72);transition:background .15s,transform .05s}
button:hover:not(:disabled){background:rgba(30,50,62,.85)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.32;cursor:not-allowed}
#b-start{background:rgba(20,90,58,.78);border-color:rgba(91,255,165,.4)}
#b-stop{background:rgba(120,26,34,.82);border-color:rgba(255,95,109,.45)}

/* 긴급 정지 중이면 화면 테두리로 알린다 */
#alarm{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
       transition:opacity .2s;box-shadow:inset 0 0 90px 26px rgba(255,60,72,.5)}
#alarm.on{opacity:1}

@media(max-width:820px){
  #chips,#state{grid-template-columns:1fr}
  #acts{width:170px}
  #couple{max-width:60vw}
}
</style></head><body>

<img id="cam" src="/camera.mjpg" alt="">
<div id="alarm"></div>

<div class="hud" id="top"><h1>MARS · UNIT 2</h1><span id="clock">연결 대기</span></div>

<div class="hud" id="couple"><div class="k">자동 결합</div><div class="v" id="coupling">기준 자세 대기</div></div>

<div class="hud" id="chips">
  <div><span class="k">CAN</span><span class="v" id="can">-</span></div>
  <div><span class="k">마커</span><span class="v" id="marker">-</span></div>
  <div><span class="k">UWB</span><span class="v" id="uwb">-</span></div>
  <div><span class="k">BNO086</span><span class="v" id="imu">-</span></div>
  <div><span class="k">솔레노이드</span><span class="v" id="solenoid">-</span></div>
</div>

<div class="hud" id="state">
  <div><div class="k">주행 모드</div><div class="v" id="mode">-</div></div>
  <div><div class="k">Fleet action</div><div class="v" id="action">-</div></div>
  <div><div class="k">Phase</div><div class="v" id="phase">-</div></div>
  <div><div class="k">명령 seq</div><div class="v" id="seq">-</div></div>
  <div style="grid-column:1/-1"><div class="k">최종 속도</div><div class="v" id="velocity">-</div></div>
</div>

<div class="hud" id="acts">
  <button id="b-start" disabled onclick="post('/api/coupling/start')">자동 결합 시작</button>
  <button id="b-cancel" disabled onclick="post('/api/coupling/cancel')">결합 취소</button>
  <button id="b-unlock" onclick="if(confirm('솔레노이드를 해제합니다. 진행할까요?'))post('/api/coupling/unlock')">결합 해제</button>
  <button id="b-stop" onclick="post('/api/emergency-stop')">긴급 정지</button>
  <button id="b-reset" onclick="post('/api/reset-emergency')">긴급 정지 해제</button>
</div>

<script>
const $=id=>document.getElementById(id);
const yn=v=>v?'<span class="ok">연결</span>':'<span class="bad">미연결</span>';
async function post(p){await fetch(p,{method:'POST'});}


const reason={reference_wait:'기준 자세 저장 대기',marker_wait:'ArUco 마커 인식 대기',
 current_threshold_unset:'접촉 전류 기준 미설정',can_unavailable:'CAN 미연결',
 current_unavailable:'모터 전류 대기',safety_stop:'안전 정지 중',marker_lost:'마커 끊김',
 solenoid_unlocked:'솔레노이드 잠금 대기',
 align_timeout:'정렬 시간 초과',contact_timeout:'접촉 감지 시간 초과',
 current_lost:'모터 전류 끊김',solenoid_timeout:'솔레노이드 확인 실패',
 locked:'결합 완료',active:'결합 진행 중',ready:'결합 가능'};

async function tick(){
  try{
    const s=await(await fetch('/api/status',{cache:'no-store'})).json();
    const d=s.drive||{},f=s.fleet||{},m=s.motor||{},c=s.coupling||{};
    $('clock').textContent=new Date().toLocaleTimeString();
    $('mode').textContent=d.mode||'-';
    $('action').textContent=f.action||d.action||'-';
    $('phase').textContent=f.phase||d.phase||'-';
    $('seq').textContent=f.seq_ack??'-';
    $('can').innerHTML=yn(!!m.can_connected);
    const marker=s.marker||{};
    // filtered detected는 짧은 누락 동안 마지막 검출을 유지한다. 화면의
    // 연결 표시는 현재 원본 프레임 검출값을 우선해 제거 즉시 바뀌게 한다.
    $('marker').innerHTML=yn(marker.raw_detected??marker.detected);
    $('uwb').innerHTML=yn((s.uwb||{}).ready);
    $('imu').innerHTML=yn((s.imu||{}).ready);
    $('solenoid').textContent=s.solenoid_locked?'잠금':'해제';
    $('velocity').textContent=`linear ${(d.linear||0).toFixed(3)} · angular ${(d.angular||0).toFixed(3)}`;
    $('coupling').textContent=`${c.phase||'대기'} · ${reason[c.reason]||reason[c.eligibility_reason]||c.reason||'-'}`;
    // 준비 센서가 아직 없더라도 시작 요청은 받을 수 있다. coupling 노드가
    // 요청을 보관하고 조건이 갖춰지는 즉시 시작하므로, 버튼은 진행 중이거나
    // 결합 완료/안전 정지 상태일 때만 막는다.
    $('b-start').disabled=!!(
      c.active||c.phase==='locked'||d.emergency_stop||d.safety_stop);
    $('b-cancel').disabled=!(c.active||c.phase==='locked'||c.phase==='error'||c.solenoid_locked);
    $('alarm').classList.toggle('on',!!(d.emergency_stop||d.safety_stop));
  }catch(e){$('clock').textContent='상태 연결 끊김';}
  finally{setTimeout(tick,250);}
}
tick();

/* MJPEG 는 끊기면 브라우저가 스스로 안 되살린다 */
$('cam').addEventListener('error',()=>{
  setTimeout(()=>{$('cam').src='/camera.mjpg?'+Date.now();},1000);});
</script></body></html>
