/**/camera:
  ros__parameters:
    # 이전 robot_camera/camera_node.py 확인값이다.
    # imx708 센서가 16:9(4608x2592)라 출력도 16:9로 맞춰야 full_fov가 잘림 없이
    # 그대로 나온다 — 4:3처럼 비율이 다르면 Picamera2가 좌우를 crop한다.
    # 2026-08-28: ArUco pose 정확도(특히 추종 거리 ~600mm 이상)를 위해
    # 640x360 -> 1280x720으로 올렸다. 마커가 화면에서 차지하는 픽셀 수가
    # 늘어야 코너 검출 잡음의 상대 오차가 줄어든다(멀수록 더 중요).
    width: 1280
    height: 720
    # 2026-09-01: 30 -> 15. 4코어에 영상 노드가 몰려 load 15 까지 갔고,
    # 마커 검출률이 0% 로 떨어졌다. 결합 접근 속도(0.10 m/s)와 제어
    # 주기(20Hz), 마커 타임아웃(0.35s)을 보면 15fps 로 충분하다.
    frame_rate: 15.0
    # marker_vision이 이 JPEG를 직접 검출하므로 경계 압축 깨짐을 줄인다.
    jpeg_quality: 82
    stream_port: 8000
    # 상대 이름이어야 launch namespace(/unit2)가 적용되어 1호기와 분리된다.
    image_topic: camera/image/compressed
    rotation: 180
    full_fov: true
