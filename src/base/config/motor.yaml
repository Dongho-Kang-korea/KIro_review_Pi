/**/motor:
  ros__parameters:
    # 이전 robot_motor/motor_controller.py 확인값이다.
    can_channel: can0
    require_can: false
    # PCAN-USB qlen=10 보호: 초기화/속도 프레임을 최대 50Hz로 직렬화한다.
    can_tx_interval_s: 0.02
    # 2026-08-31 실측으로 확인: 컨트롤러는 0x09(엔코더)를 100Hz로 알아서
    # 뿌리지만 0x14(전류)는 **뿌리지 않는다.** RTR로 조회하면 응답한다
    # (ID1에 0x14 요청 -> (setpoint, measured) 반환 확인. 0x17 온도도 응답,
    # 0x18 버스전압만 무응답). 즉 전류는 이 요청 없이는 영영 안 들어오고,
    # 자동 결합(coupling)과 여름 적재(cargo_load)의 접촉 판정이 통째로 죽는다.
    # 예전에 false 였던 이유("GDS68 공식 자료에서 미확인")는 이 실측으로 해소.
    enable_rtr_requests: true
    test_single_id: 0
    left_id: 1
    right_id: 2
    roller_id: 3
    vel_scale: 22.5
    max_vel: 45.0
    invert: true
    max_accel: 7.5
    max_decel: 15.0
    control_rate: 50.0
    keepalive_interval: 0.05
    send_threshold: 0.02
    roller_scale: 5.0
    roller_max_vel: 10.0
    roller_invert: false
    current_request_rate: 10.0
    can_response_timeout_s: 0.5
    cmd_vel_timeout_s: 0.5
    # 롤러 명령이 이 시간 끊기면 토크를 뗀다. cargo_load 가 적재 도중 죽으면
    # 롤러만 계속 도는 상태가 되기 때문이다. cargo_load 는 20Hz 로 재발행한다.
    roller_cmd_timeout_s: 0.5
    # 접촉 전류 기준의 **공통 폴백**이다. 미션 노드가 자기 값을 갖고 있으면
    # (coupling.yaml / cargo.yaml 의 같은 이름 키) 그쪽이 이긴다 — 결합과
    # 적재는 접근 속도가 달라 접촉 전류도 다르기 때문이다. 둘 다 0 이면
    # 자동 접촉 판정을 하지 않는다(실측 전 안전 상태).
    contact_current_threshold_a: 0.0
