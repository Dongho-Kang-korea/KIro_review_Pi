/**/coupled_drive:
  ros__parameters:
    enabled: true
    # 1호기 속도가 이 시간 끊기면 0을 낸다. 1호기 drive/coupled.py 가
    # /fleet/cmd_vel/unit2 로 50Hz 로 보내므로, 0.5 초면 25 프레임을
    # 놓친 뒤다 — 통신 지터가 아니라 확실한 두절이다.
    leader_timeout_s: 0.5
    # 결합이 locked 일 때만 굴린다. 결합 없이 부호만 확인할 때는 false 로 둔다.
    require_locked: true
    # ★ 실측 전까지 믿지 말 것. 결합 기하(2호기가 180도 돌아 붙는다)에 따라
    # 1호기의 전진이 2호기에서는 후진일 수 있다. 처음에는 max_linear_mps 를
    # 0.05 정도로 낮춰 부호부터 확인한 뒤 올린다.
    linear_sign: 1.0
    # 2026-09-04: 결합부가 **강체**로 확인되어 켰다.
    #
    # 강체로 붙으면 두 호기는 하나의 긴 물체이고, 강체의 각속도는 어느
    # 지점에서나 같다. 그래서 2호기 궤도도 1호기와 같은 각속도로 명령해야
    # 한다. 좌우를 같은 속도로 굴리면(조향 0) 2호기는 회전을 막는 쪽으로
    # 버텨서 1호기가 그 저항까지 이겨야 한다 — 잠긴 캐스터와 같다.
    #
    # 힌지형으로 바뀌면 반드시 다시 꺼야 한다. 조인트 각을 모르는 채로
    # 조향을 복제하면 잭나이프가 난다.
    follow_angular: true
    # ★ linear_sign 과 같은 이유로 실측 대상이다. 2호기가 180도 돌아 붙으면
    # 전진과 회전 둘 다 부호가 뒤집힌다. 부호 확인은 반드시 낮은 속도로.
    angular_sign: 1.0
    # 1호기가 자기 쪽에서 이미 max_linear_mps 0.05 / max_angular_rps 0.08 로
    # 조인 값을 보낸다. 여기 값은 그 위에 씌우는 2호기 자체 안전 상한이다.
    max_linear_mps: 0.35
    max_angular_rps: 0.30
    # 1호기 발행(50Hz)보다 느리면 그 차이만큼 2호기 바퀴가 늦게 따라간다.
    publish_rate_hz: 50.0
