/**/follow_leader:
  ros__parameters:
    # 이전 following_ctrl.py 확인값이다.
    target_distance_mm: 600.0
    k_linear: 0.0005
    k_angular: 1.0
    distance_tolerance_mm: 50.0
    lateral_tolerance_m: 0.03
    # 2026-08-29 추가 — 마커 yaw(정면 정렬) 비례항. 리더가 제자리에서
    # 돌 때 팔로워도 같이 정렬하게 한다. k_angular(좌우 오프셋)와 달리
    # 아직 실측 튜닝 전이라 0.0(비활성)이 기본값이다 — 이 값을 그대로
    # 두면 지금까지와 똑같이 동작한다(회귀 없음). 실측 순서는
    # TODO.md 11번 참고: 로봇을 세워두고 마커를 손으로 천천히 돌려보며
    # 작은 값(예 0.01)부터 올려 정렬 방향을 확인하고 필요하면 부호를
    # 뒤집는다.
    # 1호기가 회전하면 2호기도 정면을 맞춰 따라 돈다(2026-09-03 확정).
    # angular.z = -k_angular*좌우(m) + k_yaw*yaw(rad), 상한 max_angular_rps.
    # yaw 20도(0.35rad)에서 0.07 rad/s 가 나오는 크기로 시작한다 --
    # 좌우항(k_angular 1.0)과 서로 밀어내지 않을 정도다.
    # ★ 부호 미검증: 코드가 +k_yaw*yaw 인데 yaw 부호 규약을 실물로
    # 확인한 적이 없다. 반대면 추종이 더 나빠지므로, 1호기를 좌우로
    # 돌려 보며 부호부터 가린 뒤 값을 올린다(TODO 26번).
    k_yaw: 0.2
    yaw_tolerance_deg: 5.0
    max_linear_mps: 0.30
    max_angular_rps: 0.50
    sensor_timeout_s: 0.5
    # UWB가 없으면 마커 거리(marker/pose)를 쓰는 설계다.
    # false 로 두면 UWB 미장착 상태에서 추종이 항상 uwb_timeout 으로 0을 낸다.
    # 여름 외 구간이 전부 추종이므로 기본을 true 로 둔다.
    # UWB를 달면 그쪽이 자동으로 우선하며, 이 값은 폴백 허용 여부일 뿐이다.
    # 2026-08-28: marker_vision의 ArUco pose 캘리브레이션이 확정돼
    # marker/pose(PoseStamped)가 다시 나온다 — 이 폴백은 이제 동작한다.
    allow_marker_distance_fallback: true
    # marker/pose의 z(거리)는 solvePnP 특성상 멀수록 잡음이 커진다(60cm서
    # 약 7%, base/marker_vision.md 참고) — UWB 폴백으로 쓸 때만 이 계수로
    # 지수이동평균해 속도 명령 떨림을 줄인다.
    marker_distance_ema_alpha: 0.3
