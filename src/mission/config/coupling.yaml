# 자동 결합 (1호기에 붙어 솔레노이드로 잠근다)
#
# ============================================================================
#  이 미션의 속도와 접촉 전류 기준 — 짝이다. 같이 재고 같이 고친다.
# ============================================================================
#   단계       속도                                  전환/판정 기준
#   ---------  ------------------------------------  ------------------------
#   align      marker_approach_speed_mps              좌우/yaw 초기 정렬
#   contact    contact_speed_mps  ★ 영상 추적+접촉   contact_current_threshold_a  ★
#   locking    정지                                  솔레노이드 상태
#   verify     verify_pull_speed_mps                  당김 전류
#
#   ★ 표시 둘이 한 쌍이다. **contact_speed_mps 를 바꾸면 접촉 전류도 바뀌므로
#     contact_current_threshold_a 를 그 속도로 다시 재야 한다.**
#     속도가 빠를수록 접촉 순간 전류가 크게 튄다 (실측 확인).
#
#   물자 적재(cargo.yaml)는 접근 속도가 달라 기준값도 따로 갖는다 —
#   두 파일의 contact_current_threshold_a 는 서로 다른 값이어도 된다.
# ============================================================================
/**/coupling:
  ros__parameters:
    # 기준 자세는 시작 순간 즉시 저장하므로 이 시간만큼 기다리지 않는다.
    # 아래 값은 대기 중 진단용 stable 표시에만 사용한다.
    marker_confirm_s: 1.0
    # 0.0 = 마커가 보이는 즉시 기준 자세 저장(대기 없음). 기준 자세는
    # 제어에 쓰이지 않고 상태 진단용이라 기본을 0 으로 둔다.
    reference_hold_s: 0.0
    marker_release_s: 1.0
    # 정지 상태의 짧은 ArUco 검출 누락 때문에 기준 수집/정렬 시간이
    # 매번 0으로 초기화되지 않게 한다. 접촉 단계의 실제 소실 handoff와는 별개다.
    marker_acquire_dropout_s: 0.35
    marker_control_timeout_s: 0.35
    align_timeout_s: 15.0
    # 초기 정렬: 화면상 좌우 중심과 yaw를 0.4초 확인하면 contact로 넘어간다.
    # 앞뒤 거리는 보지 않으며, align 중에는 전진하지 않는다.
    initial_align_confirm_s: 0.4
    marker_approach_speed_mps: 0.10
    # 마커가 contact 진입 당시 크기에서 220 px까지 커지는 동안
    # 0.10 -> 0.04 m/s로 연속 감속한다.
    marker_near_speed_mps: 0.04
    # abs(offset_x_px / side_px) <= 0.08이면 좌우 중앙 정렬로 본다.
    lateral_tolerance_marker_ratio: 0.08
    # === 정렬 (2026-09-01 재작성, 7월 docking_ctrl 구조) ===
    # 오차는 방위각 atan2(x_mm, z_mm). 거리와 무관하게 의미가 일정하다.
    bearing_tolerance_deg: 2.0
    # 방위각 2도(0.035rad) -> 명령 0.021 -> 실효배율 2.0 이면 실제 0.042 rad/s.
    # 마커 프레임(0.09s)당 방위각 변화 0.22도로 허용치(2도) 안이라 멈출 수 있다.
    kp_bearing_rps_per_rad: 0.6
    # 완료는 시간이 아니라 새 마커 표본 연속 N 개. 11Hz 기준 약 0.55초.
    align_stable_samples: 6
    lateral_tolerance_m: 0.01
    roll_tolerance_deg: 2.0
    pitch_tolerance_deg: 4.0
    yaw_tolerance_deg: 2.0
    # contact에서도 ArUco가 보이는 동안 PI로 중심을 유지하며 감속 전진한다.
    # marker_vision이 최근 원본 프레임들을 분석해 약 0.25초 연속 소실을
    # 확정하더라도 아래 크기 증가 추세가 먼저 확인된 경우에만 화면 밖으로
    # 나간 것으로 보고 marker/enable=false 후 마지막 정렬 방향으로 직진한다.
    # 그냥 마커를 치웠거나 검출이 끊기면 정지하고 자동 재검출한다.
    marker_blind_arm_side_px: 220.0
    marker_blind_min_side_px: 120.0
    marker_growth_window_s: 0.8
    marker_growth_min_duration_s: 0.35
    marker_growth_min_px: 20.0
    marker_growth_min_ratio: 1.15
    marker_growth_positive_ratio: 0.65
    # multi-frame 판정이 이미 끝난 상태이므로 여기서는 추가 지연하지 않는다.
    # 원본 프레임에서 마커가 사라졌을 때 블라인드 접촉으로 넘어가기
    # 전에 기다리는 시간. 검출이 한 프레임 튄 것과 진짜 소실을 가른다.
    # 0.5초면 마커 11Hz 기준 대여섯 프레임이라 충분하다.
    marker_disappear_confirm_s: 0.0
    # z_mm은 상태 표시와 기준 기록에 남긴다. 실제 영상 제어 종료는
    # 다중 프레임 소실 + 위 크기 증가 추세의 두 조건으로 판단한다.
    z_ema_alpha: 0.35
    # 마커 중심의 가로 픽셀 오차를 마커 크기로 나눈 값과 yaw의 PI 제어.
    # z/roll/pitch는 제어하지 않고 상태 표시만 한다.
    # 2026-09-01 실측으로 재산정. 마커가 11Hz(0.09s)로 들어오는데 회전
    # 0.25 rad/s 로 돌면 한 프레임에 중심비가 0.0225*(z/40)=0.28 만큼
    # 바뀐다 — 허용치 0.08 의 3.5배라 절대 못 멈추고 좌우로 튕겼다.
    # k=0.25 면 허용치 근처에서 0.02 rad/s -> 프레임당 변화 0.018 로
    # 허용치 안에 들어와 수렴한다. 이전 2.0 은 중심비 0.125 만 넘어도
    # 최대 각속도로 포화돼 사실상 온-오프 제어였다.
    # === 2026-09-01 실측 기반 재산정 ===
    # 실효 배율: 명령 angular.z 대비 실제 회전이 **2.0배**다(무한궤도
    # 슬립 포함, +-0.010/0.020/0.035 에서 1.2~2.3 측정). motor.yaml 의
    # vel_scale 22.5 는 바퀴 rev/s 로 가는 배율이고, 실제 차체 회전은
    # 궤도 슬립 때문에 그 중 일부만 남는다.
    #
    # 마커는 11Hz(0.09s)로 들어오고 중심비는 각도당 fx/side = 12.1 이라
    #   프레임당 중심비 변화 = 명령 * 2.0 * 0.09 * 12.1 = 명령 * 2.18
    # 허용치 0.08 을 한 프레임에 넘지 않으려면 명령 < 0.037 이어야 한다.
    # k=0.20 이면 허용치 근처에서 0.016 -> 프레임당 0.035 로 안쪽이다.
    k_lateral: 0.20
    # 정상상태 치우침만 걷어내는 용도. 크게 두면 관성과 겹쳐 넘어간다.
    ki_lateral: 0.05
    # 감쇠. 관성으로 중심을 지나치는 것을 막는다. 중심 오차 잡음이
    # 1sigma 0.0016 으로 깨끗해 미분을 써도 잡음 증폭이 무시할 수준이다.
    # 0.15 로 켰더니 오히려 발산했다(2026-09-01) — 변화율을 마커 수신
    # 간격이 아니라 제어 tick 간격으로 나눠 1.8배 부풀려진 탓이다.
    # 계산을 고치기 전까지 0 으로 끈다.
    # 중심 통과 시 실제 각속도 0.10 rad/s -> 중심비 변화율 약 1.2/s.
    # 이를 상쇄하려면 kd * 1.2 ~ 0.05(최대 명령) -> kd ~ 0.04.
    # 최대 명령의 절반 정도만 감쇠에 쓴다(0.02 * 0.48 = 0.0096).
    kd_lateral: 0.02
    # 2026-09-01: 0.012 는 yaw 오차 30도에서 0.36 rad/s 로 화면 중심 항을
    # 넘어섰다. 이제 중심이 맞은 프레임에서만 더해지지만, 그 안에서도
    # 중심 보정을 밀어내지 않도록 낮춰 둔다.
    k_yaw: 0.004
    ki_yaw: 0.0008
    lateral_integral_limit_m_s: 0.08
    yaw_integral_limit_deg_s: 30.0
    k_roll: 0.0
    k_pitch: 0.0
    # --- 속도 (ArUco align 단계) ---
    # max_forward_mps는 초기 align 속도 상한이다.
    max_forward_mps: 0.10
    max_reverse_mps: 0.25
    # 0.45 rad/s(약 26 deg/s)는 한 번 포화되면 마커가 곧바로 시야를 벗어난다.
    # 명령 0.05 = 실제 약 0.10 rad/s. 이보다 키우면 한 프레임에 허용치를
    # 훌쩍 넘어 좌우로 튕긴다(오늘 0.15~0.45 에서 전부 그랬다).
    # 명령 0.02 = 실제 0.04 rad/s -> 중심비 0.48/s -> 마커 프레임당 0.043.
    # 허용치 0.08 보다 작아야 그 구간 안에서 멈출 수 있다. 0.05(프레임당
    # 0.11)에서는 원리적으로 못 멈추고 limit cycle 이 남았다.
    max_angular_rps: 0.02
    angular_pause_deg: 10.0

    # ------------------------------------------------------------------
    #  [결합-contact] 접촉 단계 — 속도와 전류 기준이 한 쌍이다
    # ------------------------------------------------------------------
    # 크기 증가 후 마커가 화면 밖으로 사라진 다음, 회전 없이 전류 접촉을
    # 찾기 위해 직진하는 속도. 기존 전류 시험과 같은 0.10 m/s다.
    # 2026-09-01: 0.04 로 낮췄다가 0.10 으로 되돌림. ★ 짝인
    # contact_current_threshold_a(1.2A)가 0.10 m/s 에서 잰 값이라
    # 이 속도여야 그 기준이 유효하다.
    contact_speed_mps: 0.10                # ★ 속도

    # 위 속도로 접근하다 전류가 이 값 이상이면 '닿았다'로 본다(A).
    # 0 이면 motor.yaml 의 공통 폴백값을 쓰고, 그것도 0 이면 결합을 시작조차
    # 하지 않는다(_eligibility 가 current_threshold_unset 으로 막는다).
    #
    #  재는 법: contact_speed_mps 와 **같은 속도**로 몰아서
    #    (1) 빈 채로 갈 때의 최고 전류   (2) 부딪혔을 때의 최저 전류
    #  두 값 사이에 넣는다. 놓치는 쪽이 더 위험하니(계속 밀어붙여 스톨)
    #  가운데보다 아래쪽으로 잡는 편이 안전하다.
    #  (대회 중에는 test_basic/current_web.py 로 쟀다 — 이 저장소에는
    #   포함하지 않았다. motor/status 의 current_a 를 보며 같은 방법으로 잰다.)
    contact_current_threshold_a: 1.2       # ★ 그 속도에서의 접촉 전류 기준

    # 새로 들어온 주행 전류 표본이 기준 이상으로 0.5초 연속 유지되어야
    # 접촉으로 확정한다. 한 번이라도 기준 아래로 내려가면 시간을 다시 잰다.
    contact_current_hold_s: 0.5
    current_timeout_s: 0.5
    # ArUco를 보며 접근할 수 있는 최대 시간.
    # 마커를 보며 접근하는 구간의 폭주 방지 상한(제어값 아님).
    # 2026-09-01: 15초는 감속 접근 시간보다 짧아, 마커가 사라지기 전에
    # 먼저 터져 _schedule_marker_retry -> marker_wait 로 빠졌다. 그러면
    # 로봇이 이미 가까워 마커가 안 보이므로 되돌아올 수 없었다.
    # 접근은 0.10 -> 0.04 로 감속하므로 60cm 를 오는 데 15초를 넘긴다.
    contact_visual_timeout_s: 45.0
    # 마커가 사라진 뒤 직진할 최대 추정 거리. 접촉 전류가
    # 올라가면 거리 카운트를 멈춰 0.5초 접촉 확정을 마친다.
    blind_contact_distance_m: 0.30
    # 거리 제한과 별개의 절대 시간 상한. 실패 시 재시작 버튼을
    # 요구하지 않고 정지 후 마커 재검출을 자동으로 기다린다.
    contact_timeout_s: 4.0
    solenoid_timeout_s: 1.5

    # --- 실제 결합 성공 검증 ---
    # 솔레노이드 잠금 확인 뒤 2호기가 반드시 후진하며 1호기를 당겨 본다.
    # 이 단계에서는 이미 ArUco 검출을 껐으므로 전류만으로 결합을 확정한다.
    verify_pull_speed_mps: -0.08
    # verify_pull_speed_mps(-0.08 m/s)로 당길 때의 전류 기준(A). 접촉(1.2A,
    # 0.10 m/s)과 속도가 달라 따로 잰다 — 이 속도를 바꾸면 다시 재야 한다.
    # 0이면 위 contact_current_threshold_a를 그대로 사용한다.
    verify_current_threshold_a: 1.2
    verify_current_confirm_samples: 3
    # -0.08 m/s 기준 실패 시 최대 약 8 cm만 후진한다.
    verify_timeout_s: 1.0
