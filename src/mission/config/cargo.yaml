# 물자 적재 (1호기 지휘로 물자를 밀고 롤러로 싣는다)
#
# approach 수신 → 2호기 180도 회전 → 정지 대기 → UWB 거리 게이트
# → 1호기가 자기 전류로 접촉을 판정해 결과 전달 → load 수신
# → 양쪽 저속 후진+롤러 → 1호기 판정 결과 또는 2호기 전류 하락 → loaded.
/**/cargo_load:
  ros__parameters:
    # 2호기는 approach를 받자마자 이 각도만큼 회전하고 그 자리에서 기다린다.
    turn_speed_rps: 0.28
    turn_target_deg: 180.0
    turn_tolerance_deg: 8.0

    # 접촉 후 load 명령을 받았을 때 1호기와 함께 후진하는 속도.
    load_speed_mps: -0.1                 # 적재 중 압박용 저속 후진
    release_roller: -0.6

    # UWB가 이 거리 안에 있을 때만 1호기가 보낸 접촉 판정을 인정한다.
    # 안테나 설치 위치에 따른 실제 접촉 거리를 재서 조정한다.
    contact_uwb_threshold_mm: 900.0
    # 1호기의 전류값/기준값을 여기 두지 않는다. 1호기가 자기 config로
    # 판정해 /fleet/status/unit1의 cargo_contact_detected로 보내며,
    # 그 판정이 연속 3번 들어오면 1호기-물자-2호기가 닿았다고 본다.
    contact_confirm_samples: 3
    sensor_timeout_s: 0.5

    # 2호기 실측 주행 전류 기준만 이 파일에 둔다. high를 먼저 넘은 뒤
    # low 아래로 내려가 2초 유지될 때 2호기 쪽 적재 완료로 본다.
    # 1호기는 자기 config에서 판정하고 cargo_load_current_dropped로 보낸다.
    # 실측 전에는 0.0이며 반드시 0.0 < low < high가 되도록 함께 입력한다.
    # 적재 완료 판정: 2호기가 load_speed_mps(-0.1 m/s)로 후진하며
    # 적재물을 밀 때의 **주행 모터(ID 1·2) 전류**다. 롤러(ID 3) 전류가
    # 아니다 -- 롤러는 커밋 37151d5 에서 분리돼 이 판정에 안 들어간다.
    # 적재물이 올라타며 저항이 high 이상으로 올랐다가, 다 올라타서
    # 눌림이 풀리며 low 아래로 떨어지면 완료로 본다. 제약: 0 < low < high.
    # 2026-09-03 사용자 지정 임시값 -- 실측 전이다(TODO 2번).
    unit2_load_high_current_a: 1.3
    unit2_load_low_current_a: 1.0
    # 적재 시작 직후의 순간 변화는 완료로 쓰지 않는다.
    load_min_duration_s: 1.0
    load_complete_hold_s: 2.0
    # 센서가 살아 있어도 적재가 끝나지 않으면 이 시간에 강제 정지한다.
    loading_timeout_s: 20.0

    red_min_area: 1200.0
    red_h_min_1: 0
    red_h_max_1: 12
    red_h_min_2: 165
    red_h_max_2: 179
    red_s_min: 90
    red_v_min: 70
    # 웹 콘솔 수동 컨베이어 조작(roller_manual_cmd)의 유지 시간 — 이 시간
    # 안에 새 값이 안 오면 자동으로 0이 된다. 자동 미션이 도는 중엔
    # 아예 채택되지 않는다(cargo_load.py 참고, 2026-08-28 추가).
    manual_roller_timeout_s: 0.4
    # 적색 화물 검출 주기(Hz). 0 이면 매 프레임(예전 동작).
    # 카메라 30fps 전부 처리하면 코어 절반을 상시로 먹는다.
    red_detect_rate_hz: 5.0
